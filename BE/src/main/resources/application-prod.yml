# Production overrides, activated with SPRING_PROFILES_ACTIVE=prod.
# Only the settings that must differ from application.yml belong here; everything else is inherited.

spring:
  sql:
    init:
      # The base profile runs schema.sql + data.sql on every boot with continue-on-error, which
      # against a live database means 395 lines of DDL replayed on each restart with any failure
      # swallowed. Production never self-initialises: schema changes go through
      # database/migrations/ as a reviewed, ordered step.
      mode: never
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false
  datasource:
    hikari:
      # Supabase's transaction pooler caps connections per project; keep the ceiling explicit
      # rather than relying on Hikari's default of 10 silently competing with other clients.
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 10000

server:
  # Let in-flight work (a payment webhook, a booking write) finish before the JVM exits on
  # redeploy, instead of dropping the connection mid-transaction.
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false

payos:
  # Deliberately without defaults. The base profile falls back to "demo-*" placeholders, which put
  # PayosService into demo mode — and in demo mode a customer can confirm their own booking as PAID
  # through the simulation endpoint without paying. A missing credential must stop the boot here
  # rather than silently open that path. PayosProductionGuard double-checks the resolved values.
  client-id: ${PAYOS_CLIENT_ID}
  api-key: ${PAYOS_API_KEY}
  checksum-key: ${PAYOS_CHECKSUM_KEY}
  return-url: ${PAYOS_RETURN_URL}
  cancel-url: ${PAYOS_CANCEL_URL}

logging:
  level:
    root: INFO
    com.cospace.app: INFO
