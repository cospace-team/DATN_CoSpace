server:
  port: 8080
  servlet:
    context-path: /

spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:BE/.env[.properties]
  application:
    name: cospace-api
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USERNAME}
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      data-source-properties:
        sslmode: ${SUPABASE_DB_SSL_MODE:require}
        # Postgres' extended query protocol can't infer a bind parameter's type when it's used
        # only in a bare "? IS NULL" check on a non-text column (uuid, native enum) — exactly the
        # "(:branchId IS NULL OR u.branchId = :branchId)" optional-filter pattern used by
        # UserRepository.filterUsers / AuditLogRepository.searchAuditLogs. That throws
        # "ERROR: could not determine data type of parameter $N" whenever the filter is left null,
        # which is the default, no-filters-applied case admin screens load with. Simple query mode
        # sends parameters as inline literals instead of server-side prepared statement binds, so
        # Postgres never has to guess — the standard pgjdbc workaround for this class of query.
        preferQueryMode: simple
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none # Changed to none to avoid Postgres ENUM type errors during startup
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
      encoding: UTF-8
      continue-on-error: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SUPABASE_JWT_ISSUER:https://ozaiknomajljfqiepels.supabase.co/auth/v1}

