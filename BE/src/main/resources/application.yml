server:
  # Render/Heroku-style hosts inject the port to bind to; 8080 stays the local default.
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:BE/.env[.properties]
      - optional:file:../.env[.properties]
  application:
    name: cospace-api
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      # Workspace photos: 5MB per image.
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: ${SUPABASE_DB_URL:jdbc:postgresql://aws-1-ap-south-1.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0}
    username: ${SUPABASE_DB_USERNAME:postgres.ozaiknomajljfqiepels}
    # No fallback on purpose: a default here put the live database password into a
    # repository anyone can read, so a missing SUPABASE_DB_PASSWORD must stop startup
    # rather than let the app connect on a secret that is public. Local runs read it
    # from BE/.env (git-ignored), deployments from the platform environment settings.
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      data-source-properties:
        sslmode: ${SUPABASE_DB_SSL_MODE:require}
        # Postgres' extended query protocol can't infer a bind parameter's type when it's used
        # only in a bare "? IS NULL" check on a non-text column (uuid, native enum) — exactly the
        # "(:branchId IS NULL OR u.branchId = :branchId)" optional-filter pattern used by
        # UserRepository.filterUsers / AuditLogRepository.searchAuditLogs. That throws
        # "ERROR: could not determine data type of parameter $N" whenever the filter is left null,
        # which is the default, no-filters-applied case admin screens load with. Simple query mode
        # sends parameters as inline literals instead of server-side prepared statement binds, so
        # Postgres never has to guess — the standard pgjdbc workaround for this class of query.
        preferQueryMode: simple
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none # Changed to none to avoid Postgres ENUM type errors during startup
    show-sql: true
    # No defer-datasource-initialization here. It only matters when Hibernate builds the schema
    # itself (ddl-auto: create), and setting it makes Spring Boot treat the entityManagerFactory
    # as a database initializer: JpaDatabaseInitializerDetector then forces every *other*
    # initializer — Flyway included — to depend on it, while JPA still has to wait for Flyway's
    # migrations. Those two edges close a loop and the context dies at boot with
    # "Circular depends-on relationship between 'flyway' and 'entityManagerFactory'".
    # Flyway owns the schema, and data.sql already runs after it (see spring.sql.init below).
    properties:
      hibernate:
        format_sql: true
  flyway:
    # Schema is owned by db/migration: V1 is the baseline the app expects, every later file is an
    # ordered change. Databases that already exist (Supabase production) are stamped at the
    # baseline instead of having V1 replayed over live data, so only V2 onwards actually runs.
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: "Existing CoSpace schema"
  sql:
    init:
      # Dev convenience only: seeds demo rows from data.sql after Flyway has built the schema
      # (Flyway's initializer is ordered ahead of the SQL-script one). There is deliberately no
      # schema.sql any more — db/migration is the only place DDL lives; the old patch script is
      # kept for reference under database/archive/migrations-legacy/.
      # Production turns this off entirely (see application-prod.yml).
      mode: always
      encoding: UTF-8
      continue-on-error: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SUPABASE_JWT_ISSUER:https://ozaiknomajljfqiepels.supabase.co/auth/v1}

momo:
  endpoint: "https://test-payment.momo.vn/v2/gateway/api/create"
  partner-code: "MOMO"
  access-key: "F8BBA842ECF85"
  secret-key: "K951B6PE1waDMi640xX08PD3vg6EkVlz"
  return-url: "http://localhost:8080/api/payments/momo/return"
  notify-url: "http://localhost:8080/api/payments/momo/ipn"

payos:
  endpoint: ${PAYOS_ENDPOINT:https://api-merchant.payos.vn}
  client-id: ${PAYOS_CLIENT_ID:demo-client-id}
  api-key: ${PAYOS_API_KEY:demo-api-key}
  checksum-key: ${PAYOS_CHECKSUM_KEY:demo-checksum-key}
  return-url: ${PAYOS_RETURN_URL:http://localhost:8080/api/payments/payos/return}
  cancel-url: ${PAYOS_CANCEL_URL:http://localhost:5173/customer/checkout}

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-3.5-flash}
  fallback-model: ${GEMINI_FALLBACK_MODEL:gemini-3.7-flash}
  base-url: https://generativelanguage.googleapis.com/v1beta

app:
  jwt:
    # Signing key for the tokens this backend issues itself (local email/password login).
    # Deliberately has no fallback: a missing APP_JWT_SECRET must fail startup rather than let the
    # app run on a key that is readable in the source. Minimum 48 bytes (HS384), see JwtUtil.
    secret: ${APP_JWT_SECRET}
    expiration: ${APP_JWT_EXPIRATION:3600}
    refresh-expiration: ${APP_JWT_REFRESH_EXPIRATION:2592000}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  frontend:
    base-url: ${APP_FRONTEND_BASE_URL:http://localhost:5173}
  supabase:
    jwt-secret: ${SUPABASE_JWT_SECRET:}
    # Workspace photos go to Supabase Storage through the backend; the service-role key stays
    # server-side. Without it uploads are refused with a clear message, everything else works.
    url: ${SUPABASE_URL:https://ozaiknomajljfqiepels.supabase.co}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
    storage-bucket: ${SUPABASE_STORAGE_BUCKET:workspace-images}
  booking:
    # Checking out later than this after the booked end adds the late check-out fee.
    late-fee-grace-minutes: ${APP_BOOKING_LATE_FEE_GRACE_MINUTES:15}
    # Guests nobody checked out are closed automatically this long after the booked end.
    auto-checkout-after-minutes: ${APP_BOOKING_AUTO_CHECKOUT_AFTER_MINUTES:120}

logging:
  level:
    root: INFO
    com.cospace.app: DEBUG
